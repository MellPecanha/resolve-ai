services:
  postgres:
    image: postgres:17
    container_name: resolve-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: resolveai
      POSTGRES_DB: resolveai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rustfs-volume-permissions:
    image: alpine:3.20
    container_name: resolve-ai-rustfs-volume-permissions
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    user: root
    volumes:
      - rustfs_data:/data

  rustfs:
    image: rustfs/rustfs:latest
    container_name: resolve-ai-rustfs
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9002
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-resolveai}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-resolveai-rustfs-password}
    ports:
      - "9001:9001"
      - "9002:9002"
    volumes:
      - rustfs_data:/data
    depends_on:
      rustfs-volume-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9001/health && curl -fsS http://127.0.0.1:9002/rustfs/console/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres_data:
  rustfs_data:
