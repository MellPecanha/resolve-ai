services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: resolveai
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no GitLab CI/CD Variables}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveai -d resolveai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://resolveai:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no GitLab CI/CD Variables}@postgres:5432/resolveai
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no GitLab CI/CD Variables}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Configure S3_PUBLIC_ENDPOINT com a URL publica do RustFS}
      S3_BUCKET: occurrence-images
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Configure S3_ACCESS_KEY no GitLab CI/CD Variables}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Configure S3_SECRET_KEY no GitLab CI/CD Variables}
      S3_CORS_ORIGIN: ${S3_CORS_ORIGIN:?Configure S3_CORS_ORIGIN com a origem publica do frontend}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  rustfs-volume-permissions:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    user: root
    volumes:
      - rustfs_data:/data

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9002
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Configure S3_ACCESS_KEY no GitLab CI/CD Variables}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Configure S3_SECRET_KEY no GitLab CI/CD Variables}
    ports:
      - "9001:9001"
      - "9002:9002"
    volumes:
      - rustfs_data:/data
    depends_on:
      rustfs-volume-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9001/health && curl -fsS http://127.0.0.1:9002/rustfs/console/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres_data:
  rustfs_data:
